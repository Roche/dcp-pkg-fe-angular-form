<table mat-table [dataSource]="dataSource" matSort class="dc-table">
  <ng-container *ngFor="let column of columns" [matColumnDef]="column.Key">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ column.Name }}</th>

    <td mat-cell *matCellDef="let row" [style.color]="getCellColor(row, column)">
      <mat-icon *ngIf="column.OrderIndex === 0 && hasMetaData(row.MetaData)" (click)="onInfoClick(row.MetaData)">
        info
      </mat-icon>
      <ng-container *ngIf="row.Cells[column.OrderIndex] as cell" [ngSwitch]="column.DataType">
        <ng-container *ngSwitchCase="'number'">{{ cell.Value | number }}</ng-container>
        <ng-container *ngSwitchCase="'date'">{{ cell.Value | date: 'mediumDate' }}</ng-container>
        <ng-container *ngSwitchDefault>{{ cell.Value }}</ng-container>
      </ng-container>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="visibleColumnKeys"></tr>
  <tr mat-row *matRowDef="let row; columns: visibleColumnKeys"></tr>
  <tr class="mat-row" *matNoDataRow>
    <td class="empty-table-cell" [attr.colspan]="visibleColumnKeys.length">
      {{'FORM_GENERATOR.NO_DATA_AVAILABLE' | translate}}
    </td>
  </tr>
</table>
<odcp-side-panel #sidePanel>
  <h1 class="meta-information-title">{{ 'FORM_GENERATOR.META_INFORMATION' | translate }}</h1>
  <odcp-table-metadata [data]="selectedMetaData"></odcp-table-metadata>
</odcp-side-panel>
